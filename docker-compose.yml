services:
  api:
    build:
      context: ./server
    ports:
      - "8787:8787"
    environment:
      API_TOKEN: ${API_TOKEN:-change-me}
      DATABASE_PATH: /data/component_vault.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8787"
      ADMIN_WEB_ORIGINS: ${ADMIN_WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081}
      WEB_INVENTORY_ENABLED: ${WEB_INVENTORY_ENABLED:-false}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-component-vault}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-component-vault-server}
    volumes:
      - component_vault_data:/data

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_DEFAULT_API_BASE_URL: ${VITE_DEFAULT_API_BASE_URL:-}
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  component_vault_data:
