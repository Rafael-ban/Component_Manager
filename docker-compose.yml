services:
  api:
    build:
      context: ./server
    ports:
      - "8787:8787"
    environment:
      API_TOKEN: change-me
      DATABASE_PATH: /data/component_vault.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8787"
    volumes:
      - component_vault_data:/data

volumes:
  component_vault_data:

