name: Release Artifacts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref or SHA to build from.
        required: true
        type: string
      release_tag:
        description: Release tag to publish. Leave blank to skip GitHub Release creation.
        required: false
        default: ''
        type: string
      release_name:
        description: Release title. Defaults to the tag name when omitted.
        required: false
        default: ''
        type: string
      release_notes:
        description: Release notes body. When empty, GitHub generated notes are used.
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Whether to create or update the GitHub Release after building artifacts.
        required: false
        default: true
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref or SHA to build from. Defaults to the current workflow SHA.
        required: false
        default: ''
        type: string
      release_tag:
        description: Optional release tag to publish or update.
        required: false
        default: ''
        type: string
      release_name:
        description: Optional release title. Defaults to the tag name when omitted.
        required: false
        default: ''
        type: string
      release_notes:
        description: Optional release notes body. Leave blank to use generated notes.
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Whether to create or update the GitHub Release after building artifacts.
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      publish_github_release: ${{ steps.resolve.outputs.publish_github_release }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
      publish_docker_image: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - name: Check optional Docker Hub publishing configuration
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_IMAGE" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Docker Hub configuration is incomplete. Native/Web artifacts will be published; no Docker Hub image will be pushed. Configure DOCKERHUB_USERNAME, DOCKERHUB_IMAGE and DOCKERHUB_TOKEN, then run Server Docker Image to publish the release image.'
          fi

      - name: Resolve release inputs
        id: resolve
        env:
          CALL_SOURCE_REF: ${{ inputs.source_ref }}
          CALL_RELEASE_TAG: ${{ inputs.release_tag }}
          CALL_RELEASE_NAME: ${{ inputs.release_name }}
          CALL_RELEASE_NOTES: ${{ inputs.release_notes }}
          CALL_PUBLISH_GITHUB_RELEASE: ${{ inputs.publish_github_release }}
          DISPATCH_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          DISPATCH_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          DISPATCH_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          DISPATCH_PUBLISH_GITHUB_RELEASE: ${{ github.event.inputs.publish_github_release }}
        run: |
          source_ref=""
          release_tag=""
          release_name=""
          release_notes=""
          publish_github_release="false"

          if [ -n "$CALL_SOURCE_REF" ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$CALL_SOURCE_REF" ]; then
              source_ref="$CALL_SOURCE_REF"
              release_tag="$CALL_RELEASE_TAG"
              release_name="$CALL_RELEASE_NAME"
              release_notes="$CALL_RELEASE_NOTES"
              publish_github_release="${CALL_PUBLISH_GITHUB_RELEASE:-true}"
            else
              source_ref="$DISPATCH_SOURCE_REF"
              release_tag="$DISPATCH_RELEASE_TAG"
              release_name="$DISPATCH_RELEASE_NAME"
              release_notes="$DISPATCH_RELEASE_NOTES"
              publish_github_release="${DISPATCH_PUBLISH_GITHUB_RELEASE:-true}"
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            source_ref="$GITHUB_REF"
            release_tag="$GITHUB_REF_NAME"
            release_name="$GITHUB_REF_NAME"
            publish_github_release="true"
          fi

          if [ -z "$source_ref" ]; then
            source_ref="$GITHUB_SHA"
          fi

          if [ -z "$release_tag" ] && [[ "$source_ref" == refs/tags/* ]]; then
            release_tag="${source_ref#refs/tags/}"
          fi

          if [ -z "$release_name" ] && [ -n "$release_tag" ]; then
            release_name="$release_tag"
          fi

          if [ -z "$release_tag" ]; then
            publish_github_release="false"
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "publish_github_release=$publish_github_release" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            printf '%s\n' "$release_notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  android-release:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Add Android SDK tools to PATH
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          else
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -name sdkmanager >&2 || true
            exit 1
          fi
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android signing secrets
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub secret: $key"
              exit 1
            fi
          done

      - name: Decode Android keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        run: gradle -p android-client assembleRelease

      - name: Normalize Android artifact name
        run: |
          mkdir -p artifacts/android
          APK_PATH=$(find android-client/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          cp "$APK_PATH" artifacts/android/component-vault-android-release.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: artifacts/android/component-vault-android-release.apk
          if-no-files-found: error

  admin-web-release:
    runs-on: ubuntu-latest
    needs: prepare
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install admin web dependencies
        run: npm ci

      - name: Build admin web
        run: npm run build

      - name: Package admin web artifact
        run: |
          mkdir -p ../artifacts/admin-web
          cd dist
          zip -r ../../artifacts/admin-web/component-vault-admin-web.zip .

      - name: Upload admin web artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-web-static
          path: artifacts/admin-web/component-vault-admin-web.zip
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    needs: prepare
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Publish Windows portable bundle
        shell: pwsh
        run: |
          $portablePublishDir = Join-Path $env:RUNNER_TEMP 'component-vault-portable-x64'

          if (Test-Path $portablePublishDir) {
            Remove-Item -LiteralPath $portablePublishDir -Recurse -Force
          }

          dotnet publish windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishProfile= `
            -p:WindowsPackageType=None `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -o $portablePublishDir

      - name: Package and smoke test Windows portable archive
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\windows'
          $portablePublishDir = Join-Path $env:RUNNER_TEMP 'component-vault-portable-x64'
          $portableStageDir = Join-Path $env:RUNNER_TEMP 'component-vault-windows-portable-x64'
          $portableZipPath = Join-Path $artifactDir 'component-vault-windows-portable-x64.zip'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'component-vault-portable-smoke'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          if (!(Test-Path $portablePublishDir)) {
            throw 'Windows portable publish output was not generated.'
          }

          if (Test-Path $portableStageDir) {
            Remove-Item -LiteralPath $portableStageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $portableStageDir | Out-Null
          Copy-Item (Join-Path $portablePublishDir '*') $portableStageDir -Recurse -Force

          if (Test-Path $portableZipPath) {
            Remove-Item -LiteralPath $portableZipPath -Force
          }

          Compress-Archive -Path $portableStageDir -DestinationPath $portableZipPath
          if (Test-Path $smokeDir) {
            Remove-Item -LiteralPath $smokeDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $portableZipPath -DestinationPath $smokeDir

          $executable = Join-Path $smokeDir 'component-vault-windows-portable-x64\ComponentVault.WinUI.exe'
          $marker = Join-Path $env:RUNNER_TEMP 'component-vault-startup-ready'
          if (!(Test-Path -LiteralPath $executable)) {
            throw "Portable archive is missing ComponentVault.WinUI.exe: $executable"
          }
          Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          $env:COMPONENT_VAULT_STARTUP_SMOKE_FILE = $marker
          $process = Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -WindowStyle Hidden -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              throw 'Windows portable startup smoke timed out before the app reported ready.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Windows portable startup smoke exited with code $($process.ExitCode)."
            }
            if (!(Test-Path -LiteralPath $marker)) {
              throw 'Windows portable app exited without completing MainWindow startup.'
            }
          } catch {
            $startupLog = Join-Path $env:LOCALAPPDATA 'ComponentVault\logs\startup.log'
            if (Test-Path -LiteralPath $startupLog) {
              Get-Content -LiteralPath $startupLog
            }
            throw
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-x64
          path: artifacts/windows/component-vault-windows-portable-x64.zip
          if-no-files-found: error

  github-release:
    if: needs.prepare.outputs.publish_github_release == 'true'
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android-release
      - admin-web-release
      - windows-release
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android-release-apk
          path: release-assets/android

      - name: Download admin web artifact
        uses: actions/download-artifact@v7
        with:
          name: admin-web-static
          path: release-assets/admin-web

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-portable-x64
          path: release-assets/windows

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$TAG_NAME" \
              release-assets/android/component-vault-android-release.apk \
              release-assets/admin-web/component-vault-admin-web.zip \
              release-assets/windows/* \
              --clobber
          else
            if [ -s "$NOTES_FILE" ]; then
              gh release create "$TAG_NAME" \
                release-assets/android/component-vault-android-release.apk \
                release-assets/admin-web/component-vault-admin-web.zip \
                release-assets/windows/* \
                --title "$RELEASE_NAME" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG_NAME" \
                release-assets/android/component-vault-android-release.apk \
                release-assets/admin-web/component-vault-admin-web.zip \
                release-assets/windows/* \
                --title "$RELEASE_NAME" \
                --generate-notes
            fi
          fi

  dockerhub-release:
    needs:
      - prepare
      - github-release
    if: needs.prepare.outputs.publish_github_release == 'true' && needs.prepare.outputs.publish_docker_image == 'true'
    uses: ./.github/workflows/server-image.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      push_image: true
