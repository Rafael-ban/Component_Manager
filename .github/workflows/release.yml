name: Release Artifacts

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref or SHA to build from.
        required: true
        type: string
      release_tag:
        description: Release tag to publish. Leave blank to skip GitHub Release creation.
        required: false
        default: ''
        type: string
      release_name:
        description: Release title. Defaults to the tag name when omitted.
        required: false
        default: ''
        type: string
      release_notes:
        description: Release notes body. When empty, GitHub generated notes are used.
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Whether to create or update the GitHub Release after building artifacts.
        required: false
        default: true
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref or SHA to build from. Defaults to the current workflow SHA.
        required: false
        default: ''
        type: string
      release_tag:
        description: Optional release tag to publish or update.
        required: false
        default: ''
        type: string
      release_name:
        description: Optional release title. Defaults to the tag name when omitted.
        required: false
        default: ''
        type: string
      release_notes:
        description: Optional release notes body. Leave blank to use generated notes.
        required: false
        default: ''
        type: string
      publish_github_release:
        description: Whether to create or update the GitHub Release after building artifacts.
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      publish_github_release: ${{ steps.resolve.outputs.publish_github_release }}
      release_notes: ${{ steps.resolve.outputs.release_notes }}
    steps:
      - name: Resolve release inputs
        id: resolve
        env:
          CALL_SOURCE_REF: ${{ inputs.source_ref }}
          CALL_RELEASE_TAG: ${{ inputs.release_tag }}
          CALL_RELEASE_NAME: ${{ inputs.release_name }}
          CALL_RELEASE_NOTES: ${{ inputs.release_notes }}
          CALL_PUBLISH_GITHUB_RELEASE: ${{ inputs.publish_github_release }}
          DISPATCH_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          DISPATCH_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          DISPATCH_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          DISPATCH_PUBLISH_GITHUB_RELEASE: ${{ github.event.inputs.publish_github_release }}
        run: |
          source_ref=""
          release_tag=""
          release_name=""
          release_notes=""
          publish_github_release="false"

          case "$GITHUB_EVENT_NAME" in
            workflow_call)
              source_ref="$CALL_SOURCE_REF"
              release_tag="$CALL_RELEASE_TAG"
              release_name="$CALL_RELEASE_NAME"
              release_notes="$CALL_RELEASE_NOTES"
              publish_github_release="${CALL_PUBLISH_GITHUB_RELEASE:-true}"
              ;;
            workflow_dispatch)
              source_ref="$DISPATCH_SOURCE_REF"
              release_tag="$DISPATCH_RELEASE_TAG"
              release_name="$DISPATCH_RELEASE_NAME"
              release_notes="$DISPATCH_RELEASE_NOTES"
              publish_github_release="${DISPATCH_PUBLISH_GITHUB_RELEASE:-true}"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                source_ref="$GITHUB_REF"
                release_tag="$GITHUB_REF_NAME"
                release_name="$GITHUB_REF_NAME"
                publish_github_release="true"
              fi
              ;;
          esac

          if [ -z "$source_ref" ]; then
            source_ref="$GITHUB_SHA"
          fi

          if [ -z "$release_tag" ] && [[ "$source_ref" == refs/tags/* ]]; then
            release_tag="${source_ref#refs/tags/}"
          fi

          if [ -z "$release_name" ] && [ -n "$release_tag" ]; then
            release_name="$release_tag"
          fi

          if [ -z "$release_tag" ]; then
            publish_github_release="false"
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "publish_github_release=$publish_github_release" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            printf '%s\n' "$release_notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  android-release:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Add Android SDK tools to PATH
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          else
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -name sdkmanager >&2 || true
            exit 1
          fi
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Validate Android signing secrets
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub secret: $key"
              exit 1
            fi
          done

      - name: Decode Android keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        run: gradle -p android-client assembleRelease

      - name: Normalize Android artifact name
        run: |
          mkdir -p artifacts/android
          APK_PATH=$(find android-client/app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          cp "$APK_PATH" artifacts/android/component-vault-android-release.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: artifacts/android/component-vault-android-release.apk
          if-no-files-found: error

  admin-web-release:
    runs-on: ubuntu-latest
    needs: prepare
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install admin web dependencies
        run: npm ci

      - name: Build admin web
        env:
          VITE_DEFAULT_API_BASE_URL: http://localhost:8787
        run: npm run build

      - name: Package admin web artifact
        run: |
          mkdir -p ../artifacts/admin-web
          cd dist
          zip -r ../../artifacts/admin-web/component-vault-admin-web.zip .

      - name: Upload admin web artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-web-static
          path: artifacts/admin-web/component-vault-admin-web.zip
          if-no-files-found: error

  windows-release:
    runs-on: windows-latest
    needs: prepare
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Create temporary Windows signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=ComponentVault' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -FriendlyName 'ComponentVault Release Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.19={text}CA=false','2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          $cerPath = Join-Path $env:RUNNER_TEMP 'component-vault-release-signing.cer'

          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "WINDOWS_CER_PATH=$cerPath" >> $env:GITHUB_ENV

      - name: Publish Windows MSIX package
        shell: pwsh
        run: |
          dotnet publish windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj `
            -c Release `
            /p:PublishProfile=win-x64.pubxml `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:WINDOWS_CERT_THUMBPRINT"

      - name: Stage Windows MSIX package
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'windows-client\ComponentVault.WinUI\bin\Release'
          $stagedMsixPath = Join-Path $env:RUNNER_TEMP 'component-vault-windows-x64.msix'
          $msix = Get-ChildItem -Path $releaseRoot -Recurse -Filter *.msix |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $msix) {
            throw 'Windows MSIX package was not generated immediately after publish.'
          }

          Copy-Item $msix.FullName $stagedMsixPath -Force
          "WINDOWS_MSIX_PATH=$stagedMsixPath" >> $env:GITHUB_ENV
          Write-Host "Staged Windows MSIX: $($msix.FullName)"

      - name: Publish Windows portable bundle
        shell: pwsh
        run: |
          $portablePublishDir = Join-Path $env:RUNNER_TEMP 'component-vault-portable-x64'

          if (Test-Path $portablePublishDir) {
            Remove-Item -LiteralPath $portablePublishDir -Recurse -Force
          }

          dotnet publish windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishProfile= `
            -p:WindowsPackageType=None `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -o $portablePublishDir

      - name: Verify staged Windows MSIX package
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PATH)) {
            throw 'WINDOWS_MSIX_PATH was not set by the staging step.'
          }

          if (!(Test-Path $env:WINDOWS_MSIX_PATH)) {
            throw "Staged MSIX package is missing: $env:WINDOWS_MSIX_PATH"
          }

          Write-Host "Verified staged Windows MSIX: $env:WINDOWS_MSIX_PATH"

      - name: Normalize Windows release artifacts
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\windows'
          $stagedMsixPath = $env:WINDOWS_MSIX_PATH
          $portablePublishDir = Join-Path $env:RUNNER_TEMP 'component-vault-portable-x64'
          $portableStageDir = Join-Path $env:RUNNER_TEMP 'component-vault-windows-portable-x64'
          $portableZipPath = Join-Path $artifactDir 'component-vault-windows-portable-x64.zip'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          if ([string]::IsNullOrWhiteSpace($stagedMsixPath)) {
            throw 'WINDOWS_MSIX_PATH is not available during artifact normalization.'
          }

          if (!(Test-Path $stagedMsixPath)) {
            throw "Staged Windows MSIX package was not found: $stagedMsixPath"
          }

          if (!(Test-Path $portablePublishDir)) {
            throw 'Windows portable publish output was not generated.'
          }

          Copy-Item $stagedMsixPath (Join-Path $artifactDir 'component-vault-windows-x64.msix') -Force
          Copy-Item $env:WINDOWS_CER_PATH (Join-Path $artifactDir 'component-vault-windows-test-certificate.cer') -Force

          if (Test-Path $portableStageDir) {
            Remove-Item -LiteralPath $portableStageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $portableStageDir | Out-Null
          Copy-Item (Join-Path $portablePublishDir '*') $portableStageDir -Recurse -Force

          if (Test-Path $portableZipPath) {
            Remove-Item -LiteralPath $portableZipPath -Force
          }

          Compress-Archive -Path $portableStageDir -DestinationPath $portableZipPath

          @'
          param(
              [string]$PackagePath = "component-vault-windows-x64.msix",
              [string]$CertificatePath = "component-vault-windows-test-certificate.cer"
          )

          $packageFullPath = Join-Path $PSScriptRoot $PackagePath
          $certificateFullPath = Join-Path $PSScriptRoot $CertificatePath
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())

          if (!(Test-Path $packageFullPath)) {
              throw "MSIX package not found: $packageFullPath"
          }

          if (!(Test-Path $certificateFullPath)) {
              throw "Certificate file not found: $certificateFullPath"
          }

          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw "Run this script from an elevated PowerShell window. MSIX test certificates must be imported into Cert:\LocalMachine\TrustedPeople."
          }

          Import-Certificate -FilePath $certificateFullPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $packageFullPath
          Write-Host "Component Vault installation completed."
          '@ | Set-Content (Join-Path $artifactDir 'Install-ComponentVault.ps1')

          @'
          Component Vault Windows release bundle

          Portable package:
          1. Unzip component-vault-windows-portable-x64.zip
          2. Open the extracted component-vault-windows-portable-x64 folder
          3. Run ComponentVault.WinUI.exe

          MSIX package:
          1. Keep component-vault-windows-x64.msix and component-vault-windows-test-certificate.cer in the same folder
          2. Open PowerShell as Administrator
          3. Run Install-ComponentVault.ps1
          '@ | Set-Content (Join-Path $artifactDir 'README-Windows-Release.txt')

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-bundle
          path: artifacts/windows
          if-no-files-found: error

  github-release:
    if: needs.prepare.outputs.publish_github_release == 'true'
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android-release
      - admin-web-release
      - windows-release
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android-release-apk
          path: release-assets/android

      - name: Download admin web artifact
        uses: actions/download-artifact@v7
        with:
          name: admin-web-static
          path: release-assets/admin-web

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-release-bundle
          path: release-assets/windows

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$TAG_NAME" \
              release-assets/android/component-vault-android-release.apk \
              release-assets/admin-web/component-vault-admin-web.zip \
              release-assets/windows/* \
              --clobber
          else
            if [ -s "$NOTES_FILE" ]; then
              gh release create "$TAG_NAME" \
                release-assets/android/component-vault-android-release.apk \
                release-assets/admin-web/component-vault-admin-web.zip \
                release-assets/windows/* \
                --title "$RELEASE_NAME" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG_NAME" \
                release-assets/android/component-vault-android-release.apk \
                release-assets/admin-web/component-vault-admin-web.zip \
                release-assets/windows/* \
                --title "$RELEASE_NAME" \
                --generate-notes
            fi
          fi
