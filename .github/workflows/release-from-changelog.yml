name: Release From Changelog

on:
  push:
    paths:
      - 'docs/CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-from-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-tag:
    if: >-
      ${{
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        !startsWith(github.event.head_commit.message, 'chore(release): sync version to ')
      }}
    runs-on: ubuntu-latest
    outputs:
      publish_release: ${{ steps.tag_state.outputs.publish_release }}
      version: ${{ steps.release_entry.outputs.version }}
      tag: ${{ steps.release_entry.outputs.tag }}
      source_ref: ${{ steps.tag_state.outputs.source_ref }}
      release_name: ${{ steps.tag_state.outputs.release_name }}
      release_notes: ${{ steps.release_notes.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Read latest concrete release entry
        id: release_entry
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          previous_args=()
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE_SHA" ] &&
             git cat-file -e "${BEFORE_SHA}:docs/CHANGELOG.md" 2>/dev/null; then
            git show "${BEFORE_SHA}:docs/CHANGELOG.md" > "$RUNNER_TEMP/previous-changelog.md"
            previous_args=(--previous-changelog "$RUNNER_TEMP/previous-changelog.md")
          fi
          python -m tools.versioning.changelog_release \
            --github-output "$GITHUB_OUTPUT" "${previous_args[@]}"

      - name: Check existing tag and release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_entry.outputs.tag }}
          HAS_RELEASE: ${{ steps.release_entry.outputs.has_release }}
          SECTION_CHANGED: ${{ steps.release_entry.outputs.section_changed }}
        run: |
          if [ "$HAS_RELEASE" != true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No concrete release heading yet; skipping."
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$SECTION_CHANGED" != true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Latest release section is unchanged; skipping."
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping."
          elif git ls-remote --exit-code --tags --refs origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Retrying release build from existing tag $TAG."
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists; use workflow_dispatch to retry its release."
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync explicit stable version metadata
        if: steps.existing.outputs.skip == 'false' && steps.existing.outputs.tag_exists != 'true' && steps.release_entry.outputs.prerelease != 'true'
        run: python tools/versioning/sync_version.py --sync-latest-stable

      - name: Configure git author
        if: steps.existing.outputs.skip == 'false' && steps.existing.outputs.tag_exists != 'true' && steps.release_entry.outputs.prerelease != 'true'
        run: |
          git config user.name "component-vault-release-bot"
          git config user.email "component-vault-release-bot@users.noreply.github.com"

      - name: Commit synchronized version files
        if: steps.existing.outputs.skip == 'false' && steps.existing.outputs.tag_exists != 'true' && steps.release_entry.outputs.prerelease != 'true'
        env:
          VERSION: ${{ steps.release_entry.outputs.version }}
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): sync version to ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ensure release tag exists
        id: tag_state
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_entry.outputs.tag }}
          VERSION: ${{ steps.release_entry.outputs.version }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        run: |
          if [ "$TAG_EXISTS" != true ]; then
            git tag -a "${TAG}" -m "Release ${VERSION}"
            git push origin "${TAG}"
          fi

          echo "source_ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists; skipping release orchestration."
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        id: release_notes
        if: steps.tag_state.outputs.publish_release == 'true'
        env:
          VERSION: ${{ steps.release_entry.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          changelog = Path("docs/CHANGELOG.md").read_text(encoding="utf-8")

          header_pattern = re.compile(rf"^## \[{re.escape(version)}\](?: - .*)?$", re.MULTILINE)
          header_match = header_pattern.search(changelog)
          if header_match is None:
              raise SystemExit(f"Unable to locate changelog section for {version}.")

          next_header = re.compile(r"^## \[", re.MULTILINE).search(changelog, header_match.end())
          section = changelog[header_match.start(): next_header.start() if next_header else len(changelog)].strip()

          with output_path.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write("release_notes<<EOF\n")
              handle.write(section)
              handle.write("\nEOF\n")
          PY

  release-artifacts:
    needs: sync-and-tag
    if: needs.sync-and-tag.outputs.publish_release == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.sync-and-tag.outputs.source_ref }}
      release_tag: ${{ needs.sync-and-tag.outputs.tag }}
      release_name: ${{ needs.sync-and-tag.outputs.release_name }}
      release_notes: ${{ needs.sync-and-tag.outputs.release_notes }}
      publish_github_release: true
