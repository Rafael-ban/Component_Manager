name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Create project-local virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: ./.venv/bin/python -m pytest -q

  android-check:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - name: Build Android debug APK
        run: gradle -p android-client assembleDebug

  windows-build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Windows client
        run: dotnet build windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj -c Debug
