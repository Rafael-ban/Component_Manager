name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate changelog-driven version sync
        run: python tools/versioning/sync_version.py --validate

  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Create project-local virtual environment
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: ./.venv/bin/python -m pytest -q

  admin-web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install admin web dependencies
        run: npm ci

      - name: Build admin web
        run: npm run build

  android-check:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Add Android SDK tools to PATH
        run: |
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          else
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -name sdkmanager >&2 || true
            exit 1
          fi
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android debug APK
        run: gradle -p android-client assembleDebug

  windows-build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}\.dotnet-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Create temporary Windows signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=ComponentVault' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature `
            -FriendlyName 'ComponentVault CI Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.19={text}CA=false','2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Package Windows client as MSIX
        shell: pwsh
        run: |
          dotnet publish windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj `
            -c Release `
            /p:PublishProfile=win-x64.pubxml `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$env:WINDOWS_CERT_THUMBPRINT"

      - name: Publish Windows portable bundle
        shell: pwsh
        run: |
          dotnet publish windows-client\ComponentVault.WinUI\ComponentVault.WinUI.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishProfile= `
            -p:WindowsPackageType=None `
            -p:GenerateAppxPackageOnBuild=false `
            -p:AppxPackageSigningEnabled=false `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -o windows-client\artifacts\portable-ci
